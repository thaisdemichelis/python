{% extends "base.html" %}
{% block content %}
<h2 class="mb-4">Dashboard de Progresso</h2>
<div class="row">
    <div class="col-md-6">
        <canvas id="graficoBarras"></canvas>
    </div>
    <div class="col-md-6">
        <canvas id="graficoPizza"></canvas>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
fetch('/api/progresso')
    .then(r => r.json())
    .then(dados => {
        const labels = ['Pendente', 'Em andamento', 'Concluída'];
        const valores = [dados['Pendente'], dados['Em andamento'], dados['Concluída']];
        const cores = ['#ffc107', '#0d6efd', '#198754'];

        new Chart(document.getElementById('graficoBarras'), {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Quantidade de Tarefas',
                    data: valores,
                    backgroundColor: cores
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: { beginAtZero: true, ticks: { stepSize: 1 } }
                }
            }
        });

        new Chart(document.getElementById('graficoPizza'), {
            type: 'pie',
            data: {
                labels: labels,
                datasets: [{
                    data: valores,
                    backgroundColor: cores
                }]
            },
            options: {
                responsive: true
            }
        });
    });
</script>
{% endblock %}
